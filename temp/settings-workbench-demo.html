<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledger - 设置与响应式顶栏演示</title>
  <style>
    /* ========================================================
       Microsoft Fluent 2 Design Tokens & Material System
       ======================================================== */
    :root {
      --color-brand: #0078d4;
      --color-brand-hover: #106ebe;
      --color-brand-pressed: #005a9e;
      --color-brand-light: #eff6fc;
      --color-brand-stroke: #c7e0f4;

      --color-neutral-fg-1: #0f172a;
      --color-neutral-fg-2: #334155;
      --color-neutral-fg-3: #64748b;
      --color-neutral-fg-subtle: #94a3b8;

      --color-neutral-stroke: rgba(0, 0, 0, 0.06);
      --color-neutral-stroke-strong: rgba(0, 0, 0, 0.12);

      --color-canvas-bg: #f1f3f6;
      --color-card-bg: #ffffff;
      --color-subtle-bg: #f8fafc;
      --color-hover-bg: #f1f5f9;

      --color-expense: #ef4444;
      --color-expense-bg: #fee2e2;
      --color-expense-stroke: #fca5a5;
      --color-expense-dark: #dc2626;

      --color-income: #10b981;
      --color-income-bg: #d1fae5;
      --color-income-stroke: #6ee7b7;
      --color-income-dark: #059669;

      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-card-hover: 0 4px 14px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.03);
      --shadow-capsule: 0 4px 20px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
      --shadow-drawer: -8px 0 32px rgba(0, 0, 0, 0.12);
      --shadow-flyout: 0 12px 28px rgba(0, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.06);

      --font-family-base: "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body.dark-mode {
      --color-neutral-fg-1: #f8fafc;
      --color-neutral-fg-2: #e2e8f0;
      --color-neutral-fg-3: #94a3b8;
      --color-neutral-fg-subtle: #64748b;

      --color-neutral-stroke: rgba(255, 255, 255, 0.08);
      --color-neutral-stroke-strong: rgba(255, 255, 255, 0.16);

      --color-canvas-bg: #0f172a;
      --color-card-bg: #1e293b;
      --color-subtle-bg: #1e293b;
      --color-hover-bg: #334155;

      --color-expense-bg: rgba(239, 68, 68, 0.15);
      --color-expense-stroke: rgba(239, 68, 68, 0.3);
      --color-income-bg: rgba(16, 185, 129, 0.15);
      --color-income-stroke: rgba(16, 185, 129, 0.3);

      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-card-hover: 0 4px 14px rgba(0, 0, 0, 0.5);
      --shadow-capsule: 0 4px 20px rgba(0, 0, 0, 0.6);
      --shadow-drawer: -8px 0 32px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family-base);
      background-color: var(--color-canvas-bg);
      color: var(--color-neutral-fg-1);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* ========================================================
       Top Navbar (Responsive Capsule: Icon-only on Mobile, Icon+Text on Desktop)
       ======================================================== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 58px;
      background: var(--color-card-bg);
      border-bottom: 1px solid var(--color-neutral-stroke);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      transition: background-color 0.2s;
    }
    @media (max-width: 640px) {
      .navbar { padding: 0 12px; }
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon-box {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--color-brand);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 2px 6px rgba(0,120,212,0.28);
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--color-neutral-fg-1);
    }

    /* Segmented Capsule Navigation */
    .capsule-nav {
      background: var(--color-canvas-bg);
      border-radius: 9999px;
      padding: 3px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: 1px solid var(--color-neutral-stroke);
    }
    .capsule-nav-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 9999px;
      border: none;
      background: transparent;
      color: var(--color-neutral-fg-3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 13px;
      font-weight: 500;
    }
    .capsule-nav-btn:hover {
      color: var(--color-neutral-fg-1);
      background: var(--color-hover-bg);
    }
    .capsule-nav-btn.active {
      background: var(--color-card-bg);
      color: var(--color-brand);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      font-weight: 600;
    }
    .capsule-text {
      display: inline;
    }
    /* Mobile breakpoint: Hide text in capsule, pure SVG icons */
    @media (max-width: 640px) {
      .capsule-nav-btn {
        width: 36px;
        padding: 0;
      }
      .capsule-text {
        display: none;
      }
    }

    .action-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-neutral-fg-3);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .icon-btn:hover {
      background: var(--color-hover-bg);
      color: var(--color-neutral-fg-1);
      border-color: var(--color-neutral-stroke);
    }
    .admin-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--color-hover-bg);
      border: 1px solid var(--color-neutral-stroke);
      border-radius: 9999px;
      font-size: 12px;
      color: var(--color-neutral-fg-2);
      user-select: none;
    }
    @media (max-width: 640px) {
      .admin-pill { display: none; }
    }
    .admin-avatar {
      width: 20px;
      height: 20px;
      border-radius: 9999px;
      background: var(--color-brand);
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ========================================================
       Settings Center Canvas
       ======================================================== */
    .main-container {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    .settings-header {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .settings-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-neutral-fg-1);
      letter-spacing: -0.01em;
    }

    /* Segmented Tabs */
    .section-tabs {
      display: inline-flex;
      background: var(--color-card-bg);
      border: 1px solid var(--color-neutral-stroke);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
      box-shadow: var(--shadow-card);
    }
    .section-tab-btn {
      padding: 7px 16px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--color-neutral-fg-3);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .section-tab-btn:hover {
      color: var(--color-neutral-fg-1);
      background: var(--color-hover-bg);
    }
    .section-tab-btn.active {
      background: var(--color-brand);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,120,212,0.25);
    }

    /* Card Panels */
    .settings-card {
      background: var(--color-card-bg);
      border-radius: 14px;
      border: 1px solid var(--color-neutral-stroke);
      padding: 20px;
      box-shadow: var(--shadow-card);
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }
    .card-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-neutral-fg-1);
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      background: var(--color-brand);
      color: #ffffff;
      border: none;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,120,212,0.25);
      transition: all 0.15s ease;
    }
    .primary-btn:hover {
      background: var(--color-brand-hover);
      transform: translateY(-1px);
    }
    .secondary-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--color-hover-bg);
      color: var(--color-neutral-fg-2);
      border: 1px solid var(--color-neutral-stroke);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .secondary-btn:hover {
      background: var(--color-card-bg);
      border-color: var(--color-neutral-stroke-strong);
      color: var(--color-neutral-fg-1);
    }

    /* Lightweight Inline Form */
    .inline-form {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 10px 12px;
      background: var(--color-subtle-bg);
      border: 1px solid var(--color-neutral-stroke);
      border-radius: 10px;
    }
    .form-input {
      flex: 1;
      padding: 7px 12px;
      border-radius: 8px;
      background: var(--color-card-bg);
      border: 1px solid var(--color-neutral-stroke-strong);
      color: var(--color-neutral-fg-1);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .form-input:focus {
      border-color: var(--color-brand);
    }

    /* Category List */
    .cat-table {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--color-neutral-stroke);
      background: var(--color-subtle-bg);
      transition: all 0.15s ease;
      position: relative;
    }
    .cat-row:hover {
      background: var(--color-card-bg);
      border-color: var(--color-neutral-stroke-strong);
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .cat-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    .cat-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-neutral-fg-1);
    }
    .tag-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 9999px;
      background: var(--color-card-bg);
      border: 1px solid var(--color-neutral-stroke);
      font-size: 11px;
      color: var(--color-neutral-fg-3);
      font-weight: 500;
    }
    .cat-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .action-icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--color-neutral-fg-3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .action-icon-btn:hover {
      background: var(--color-hover-bg);
      color: var(--color-neutral-fg-1);
    }
    .action-icon-btn.danger:hover {
      background: var(--color-expense-bg);
      color: var(--color-expense-dark);
    }

    /* Context Dropdown Menu */
    .context-menu {
      position: absolute;
      right: 12px;
      top: calc(100% + 4px);
      width: 120px;
      background: var(--color-card-bg);
      border: 1px solid var(--color-neutral-stroke-strong);
      border-radius: 8px;
      box-shadow: var(--shadow-flyout);
      padding: 4px;
      z-index: 30;
      display: flex;
      flex-direction: column;
    }
    .context-menu-item {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      text-align: left;
      font-size: 12px;
      color: var(--color-neutral-fg-1);
      cursor: pointer;
      transition: background 0.15s;
    }
    .context-menu-item:hover {
      background: var(--color-hover-bg);
    }
    .context-menu-item.danger {
      color: var(--color-expense-dark);
    }
    .context-menu-item.danger:hover {
      background: var(--color-expense-bg);
    }

    /* Payment Methods Grid */
    .pm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }
    .pm-card {
      background: var(--color-subtle-bg);
      border: 1px solid var(--color-neutral-stroke);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }
    .pm-card:hover {
      background: var(--color-card-bg);
      border-color: var(--color-neutral-stroke-strong);
    }
    .pm-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-neutral-fg-1);
    }
    .pm-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: var(--color-brand);
    }

    /* ========================================================
       Layer 3: Progressive Disclosure Container (Tag Drawer)
       ======================================================== */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      justify-content: flex-end;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .drawer-overlay.active {
      display: flex;
      opacity: 1;
    }
    .drawer-content {
      width: 100%;
      max-width: 420px;
      height: 100%;
      background: var(--color-card-bg);
      box-shadow: var(--shadow-drawer);
      display: flex;
      flex-direction: column;
      animation: slideInRight 0.22s ease-out;
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-neutral-stroke);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .drawer-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--color-neutral-stroke);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: var(--color-subtle-bg);
    }

    /* Tag Item inside Drawer */
    .drawer-tag-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: var(--color-subtle-bg);
      border: 1px solid var(--color-neutral-stroke);
      border-radius: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- ========================================================
       Top Navigation Bar
       ======================================================== -->
  <header class="navbar">
    <!-- Left: Brand -->
    <div class="brand-cluster">
      <div class="brand-icon-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
        </svg>
      </div>
      <span class="brand-name">Ledger</span>
    </div>

    <!-- Center: Segmented Capsule Navigation (hidden sm:inline for text) -->
    <nav class="capsule-nav" aria-label="主页面导航">
      <button type="button" class="capsule-nav-btn" title="账目流水" aria-label="账目流水" onclick="switchMainTab('stream')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <span class="capsule-text">账目流水</span>
      </button>

      <button type="button" class="capsule-nav-btn" title="收支统计" aria-label="收支统计" onclick="switchMainTab('stats')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10" />
          <line x1="12" y1="20" x2="12" y2="4" />
          <line x1="6" y1="20" x2="6" y2="14" />
        </svg>
        <span class="capsule-text">收支统计</span>
      </button>

      <button type="button" class="capsule-nav-btn active" title="基础设置" aria-label="基础设置" onclick="switchMainTab('settings')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        <span class="capsule-text">基础设置</span>
      </button>
    </nav>

    <!-- Right: Theme & Profile -->
    <div class="action-cluster">
      <button type="button" class="icon-btn" title="切换深色/浅色" aria-label="切换深色/浅色" onclick="toggleTheme()">
        <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>

      <div class="admin-pill" title="已认证管理员">
        <div class="admin-avatar">A</div>
        <span>admin</span>
      </div>

      <button type="button" class="icon-btn" title="退出登录" aria-label="退出登录" onclick="alert('登出操作')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ========================================================
       Settings Center
       ======================================================== -->
  <main class="main-container">
    <div class="settings-header">
      <h1 class="settings-title">设置</h1>

      <!-- Segmented Tabs: 2 real business categories -->
      <div class="section-tabs" role="tablist">
        <button type="button" class="section-tab-btn active" id="tab-cat" onclick="switchSection('cat')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
          </svg>
          <span>分类与标签</span>
        </button>

        <button type="button" class="section-tab-btn" id="tab-pm" onclick="switchSection('pm')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="5" width="20" height="14" rx="2" />
            <line x1="2" y1="10" x2="22" y2="10" />
          </svg>
          <span>支付途径</span>
        </button>
      </div>
    </div>

    <!-- Section 1: Categories & Tags (Active) -->
    <div id="section-cat" class="settings-card">
      <div class="card-topbar">
        <h2 class="card-title">消费类型</h2>
        <button type="button" class="primary-btn" onclick="toggleAddCategoryForm()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <span>新增类型</span>
        </button>
      </div>

      <!-- Lightweight Inline Creation Form (Not Heavy Modal) -->
      <div id="add-cat-form" class="inline-form" style="display: none;">
        <input type="text" id="new-cat-input" class="form-input" placeholder="输入类型名称 (如：数码科技)" />
        <button type="button" class="primary-btn" onclick="submitNewCategory()">确定</button>
        <button type="button" class="secondary-btn" onclick="toggleAddCategoryForm()">取消</button>
      </div>

      <!-- Category List -->
      <div class="cat-table" id="cat-table-list">
        <!-- Rendered via JS to maintain SSOT demo -->
      </div>
    </div>

    <!-- Section 2: Payment Methods -->
    <div id="section-pm" class="settings-card" style="display: none;">
      <div class="card-topbar">
        <h2 class="card-title">支付途径</h2>
        <button type="button" class="primary-btn" onclick="toggleAddPmForm()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <span>添加途径</span>
        </button>
      </div>

      <!-- Lightweight Inline Creation Form -->
      <div id="add-pm-form" class="inline-form" style="display: none;">
        <input type="text" id="new-pm-input" class="form-input" placeholder="输入途径名称 (如：交通卡、美团月付)" />
        <button type="button" class="primary-btn" onclick="submitNewPaymentMethod()">确定</button>
        <button type="button" class="secondary-btn" onclick="toggleAddPmForm()">取消</button>
      </div>

      <div class="pm-grid" id="pm-grid-list">
        <!-- Rendered via JS -->
      </div>
    </div>
  </main>

  <!-- ========================================================
       Layer 3: Progressive Disclosure Container (Tag Drawer)
       ======================================================== -->
  <div id="tag-drawer" class="drawer-overlay" onclick="closeDrawer(event)">
    <div class="drawer-content" onclick="event.stopPropagation()">
      <div class="drawer-header">
        <h3 id="drawer-cat-title" style="font-size: 15px; font-weight: 600;">细分标签</h3>
        <button type="button" class="icon-btn" onclick="closeTagDrawer()">✕</button>
      </div>

      <div class="drawer-body">
        <!-- Add tag input -->
        <div style="display: flex; gap: 8px;">
          <input type="text" id="new-tag-input" class="form-input" placeholder="添加细分标签..." />
          <button type="button" class="primary-btn" onclick="submitNewTag()">添加</button>
        </div>

        <!-- Tags List -->
        <div id="drawer-tags-list" style="display: flex; flex-direction: column; gap: 8px;">
          <!-- Dynamically populated from activeCategory SSOT -->
        </div>
      </div>

      <div class="drawer-footer">
        <button type="button" class="secondary-btn" onclick="closeTagDrawer()">完成</button>
      </div>
    </div>
  </div>

  <script>
    // SSOT Data Store for Demo
    const store = {
      categories: [
        { id: 1, name: '餐饮美食', tags: [{ id: 101, name: '午餐' }, { id: 102, name: '晚餐' }, { id: 103, name: '咖啡奶茶' }, { id: 104, name: '超市买菜' }] },
        { id: 2, name: '交通出行', tags: [{ id: 201, name: '地铁' }, { id: 202, name: '打车出租' }, { id: 203, name: '公交' }] },
        { id: 3, name: '居家生活', tags: [{ id: 301, name: '房租月供' }, { id: 302, name: '物业水暖' }, { id: 303, name: '日用百货' }] },
        { id: 4, name: '休闲娱乐', tags: [{ id: 401, name: '电影演出' }, { id: 402, name: '数字游戏' }, { id: 403, name: '运动健身' }] },
        { id: 5, name: '职业收入', tags: [{ id: 501, name: '主业工资' }, { id: 502, name: '年终奖金' }, { id: 503, name: '兼职报酬' }] }
      ],
      paymentMethods: [
        { id: 1, name: '微信支付' },
        { id: 2, name: '支付宝' },
        { id: 3, name: '招商银行卡' },
        { id: 4, name: '现金钞票' }
      ],
      activeCategoryId: null,
      editingCatId: null,
      editingTagId: null,
      openCatMenuId: null
    };

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    function switchMainTab(tab) {
      document.querySelectorAll('.capsule-nav-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
    }

    function switchSection(sec) {
      document.querySelectorAll('.section-tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + sec).classList.add('active');

      document.getElementById('section-cat').style.display = sec === 'cat' ? 'block' : 'none';
      document.getElementById('section-pm').style.display = sec === 'pm' ? 'block' : 'none';
    }

    // Category CRUD
    function renderCategories() {
      const container = document.getElementById('cat-table-list');
      container.innerHTML = '';

      store.categories.forEach((cat, index) => {
        const row = document.createElement('div');
        row.className = 'cat-row';

        if (store.editingCatId === cat.id) {
          row.innerHTML = `
            <div style="display: flex; gap: 8px; width: 100%;">
              <input type="text" id="rename-cat-${cat.id}" class="form-input" value="${cat.name}" />
              <button class="primary-btn" onclick="saveCategoryRename(${cat.id})">保存</button>
              <button class="secondary-btn" onclick="cancelCategoryRename()">取消</button>
            </div>
          `;
        } else {
          row.innerHTML = `
            <div class="cat-info">
              <span class="cat-name">${cat.name}</span>
              <span class="tag-badge">${cat.tags.length} 个标签</span>
            </div>
            <div class="cat-actions">
              <button type="button" class="secondary-btn" onclick="openTagDrawer(${cat.id})">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                </svg>
                <span>管理标签</span>
              </button>
              <button type="button" class="action-icon-btn" title="上移" onclick="moveCategory(${index}, -1)" ${index === 0 ? 'disabled style="opacity:0.3;"' : ''}>▲</button>
              <button type="button" class="action-icon-btn" title="下移" onclick="moveCategory(${index}, 1)" ${index === store.categories.length - 1 ? 'disabled style="opacity:0.3;"' : ''}>▼</button>
              <button type="button" class="action-icon-btn" title="更多" onclick="toggleCatMenu(${cat.id})">···</button>
            </div>
            ${store.openCatMenuId === cat.id ? `
              <div class="context-menu">
                <button class="context-menu-item" onclick="startCategoryRename(${cat.id})">重命名</button>
                <button class="context-menu-item danger" onclick="deleteCategory(${cat.id})">删除</button>
              </div>
            ` : ''}
          `;
        }
        container.appendChild(row);
      });
    }

    function toggleAddCategoryForm() {
      const form = document.getElementById('add-cat-form');
      const isHidden = form.style.display === 'none';
      form.style.display = isHidden ? 'flex' : 'none';
      if (isHidden) document.getElementById('new-cat-input').focus();
    }

    function submitNewCategory() {
      const input = document.getElementById('new-cat-input');
      const val = input.value.trim();
      if (!val) return;
      store.categories.push({ id: Date.now(), name: val, tags: [] });
      input.value = '';
      toggleAddCategoryForm();
      renderCategories();
    }

    function toggleCatMenu(catId) {
      store.openCatMenuId = store.openCatMenuId === catId ? null : catId;
      renderCategories();
    }

    function startCategoryRename(catId) {
      store.editingCatId = catId;
      store.openCatMenuId = null;
      renderCategories();
      setTimeout(() => document.getElementById(`rename-cat-${catId}`)?.focus(), 50);
    }

    function saveCategoryRename(catId) {
      const input = document.getElementById(`rename-cat-${catId}`);
      const val = input?.value.trim();
      if (val) {
        const cat = store.categories.find(c => c.id === catId);
        if (cat) cat.name = val;
      }
      store.editingCatId = null;
      renderCategories();
    }

    function cancelCategoryRename() {
      store.editingCatId = null;
      renderCategories();
    }

    function deleteCategory(catId) {
      store.categories = store.categories.filter(c => c.id !== catId);
      store.openCatMenuId = null;
      renderCategories();
    }

    function moveCategory(index, delta) {
      const target = index + delta;
      if (target < 0 || target >= store.categories.length) return;
      const tmp = store.categories[index];
      store.categories[index] = store.categories[target];
      store.categories[target] = tmp;
      renderCategories();
    }

    // Payment Methods CRUD
    function renderPaymentMethods() {
      const grid = document.getElementById('pm-grid-list');
      grid.innerHTML = '';
      store.paymentMethods.forEach((pm) => {
        const item = document.createElement('div');
        item.className = 'pm-card';
        item.innerHTML = `
          <div class="pm-title">
            <span class="pm-dot"></span>
            <span>${pm.name}</span>
          </div>
          <button type="button" class="action-icon-btn danger" title="删除" onclick="deletePaymentMethod(${pm.id})">✕</button>
        `;
        grid.appendChild(item);
      });
    }

    function toggleAddPmForm() {
      const form = document.getElementById('add-pm-form');
      const isHidden = form.style.display === 'none';
      form.style.display = isHidden ? 'flex' : 'none';
      if (isHidden) document.getElementById('new-pm-input').focus();
    }

    function submitNewPaymentMethod() {
      const input = document.getElementById('new-pm-input');
      const val = input.value.trim();
      if (!val) return;
      store.paymentMethods.push({ id: Date.now(), name: val });
      input.value = '';
      toggleAddPmForm();
      renderPaymentMethods();
    }

    function deletePaymentMethod(pmId) {
      store.paymentMethods = store.paymentMethods.filter(p => p.id !== pmId);
      renderPaymentMethods();
    }

    // Drawer with SSOT
    function openTagDrawer(catId) {
      store.activeCategoryId = catId;
      const cat = store.categories.find(c => c.id === catId);
      if (!cat) return;
      document.getElementById('drawer-cat-title').textContent = cat.name + ' · 细分标签';
      renderDrawerTags();
      document.getElementById('tag-drawer').classList.add('active');
    }

    function renderDrawerTags() {
      const cat = store.categories.find(c => c.id === store.activeCategoryId);
      const list = document.getElementById('drawer-tags-list');
      list.innerHTML = '';
      if (!cat || cat.tags.length === 0) {
        list.innerHTML = '<div style="font-size: 13px; color: var(--color-neutral-fg-subtle); padding: 12px 0;">暂无细分标签</div>';
        return;
      }

      cat.tags.forEach((t) => {
        const item = document.createElement('div');
        item.className = 'drawer-tag-item';

        if (store.editingTagId === t.id) {
          item.innerHTML = `
            <div style="display: flex; gap: 6px; width: 100%;">
              <input type="text" id="rename-tag-${t.id}" class="form-input" value="${t.name}" style="padding: 4px 8px; font-size: 12px;" />
              <button class="primary-btn" style="padding: 4px 10px; font-size: 12px;" onclick="saveTagRename(${t.id})">保存</button>
              <button class="secondary-btn" style="padding: 4px 8px; font-size: 12px;" onclick="cancelTagRename()">✕</button>
            </div>
          `;
        } else {
          item.innerHTML = `
            <span>${t.name}</span>
            <div style="display: flex; gap: 4px;">
              <button class="action-icon-btn" title="重命名" onclick="startTagRename(${t.id})">✎</button>
              <button class="action-icon-btn danger" title="删除" onclick="deleteTag(${t.id})">✕</button>
            </div>
          `;
        }
        list.appendChild(item);
      });
    }

    function submitNewTag() {
      const input = document.getElementById('new-tag-input');
      const val = input.value.trim();
      if (!val) return;
      const cat = store.categories.find(c => c.id === store.activeCategoryId);
      if (!cat) return;
      cat.tags.push({ id: Date.now(), name: val });
      input.value = '';
      renderDrawerTags();
      renderCategories(); // Sync SSOT
    }

    function startTagRename(tagId) {
      store.editingTagId = tagId;
      renderDrawerTags();
      setTimeout(() => document.getElementById(`rename-tag-${tagId}`)?.focus(), 50);
    }

    function saveTagRename(tagId) {
      const input = document.getElementById(`rename-tag-${tagId}`);
      const val = input?.value.trim();
      const cat = store.categories.find(c => c.id === store.activeCategoryId);
      if (val && cat) {
        const tag = cat.tags.find(t => t.id === tagId);
        if (tag) tag.name = val;
      }
      store.editingTagId = null;
      renderDrawerTags();
    }

    function cancelTagRename() {
      store.editingTagId = null;
      renderDrawerTags();
    }

    function deleteTag(tagId) {
      const cat = store.categories.find(c => c.id === store.activeCategoryId);
      if (cat) {
        cat.tags = cat.tags.filter(t => t.id !== tagId);
      }
      renderDrawerTags();
      renderCategories(); // Sync SSOT
    }

    function closeTagDrawer() {
      document.getElementById('tag-drawer').classList.remove('active');
      store.activeCategoryId = null;
      store.editingTagId = null;
    }

    function closeDrawer(e) {
      if (e.target.id === 'tag-drawer') {
        closeTagDrawer();
      }
    }

    // Close menus on outside click
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.cat-actions')) {
        if (store.openCatMenuId !== null) {
          store.openCatMenuId = null;
          renderCategories();
        }
      }
    });

    // Initial render
    renderCategories();
    renderPaymentMethods();
  </script>
</body>
</html>
